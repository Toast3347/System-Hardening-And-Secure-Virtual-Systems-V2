name: terraform-registry

# Fully automated, idempotent provisioning of the GHCR-side infrastructure:
#   - GitHub Actions permissions on the repo
#   - GitHub Environments (dev / tst / acc / prd) used by build workflows
#   - Branch deployment policies + reviewers for prd
#
# Auth: GITHUB_TOKEN (default, scoped per-job). No long-lived secrets.

on:
  push:
    branches: [main]
    paths:
      - 'terraform/registry/**'
      - '.github/workflows/terraform-registry.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/registry/**'
      - '.github/workflows/terraform-registry.yml'
  workflow_dispatch:

permissions:
  contents: read
  # Needed for the github provider to manage repo settings + environments.
  administration: write
  actions: write

concurrency:
  group: terraform-registry
  cancel-in-progress: false

env:
  TF_VERSION: '1.9.5'
  TF_DIR: terraform/registry

jobs:
  terraform:
    name: terraform (registry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false -reconfigure -backend-config=envs/registry.backend.hcl

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate -no-color

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        env:
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
        run: |
          terraform plan -input=false -no-color \
            -var "github_repository=${GITHUB_REPOSITORY#*/}" \
            -out=tfplan

      - name: Terraform apply
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.TF_DIR }}
        env:
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
        run: terraform apply -input=false -auto-approve tfplan
