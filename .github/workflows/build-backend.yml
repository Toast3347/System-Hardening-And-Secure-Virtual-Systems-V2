name: build-backend

# Fully automated pipeline:
#   1. terraform fmt / validate / init / plan on terraform/registry  (every PR + push)
#   2. docker buildx build of ComicRealmBE                           (every PR + push)
#   3. push image to ghcr.io/<owner>/comicrealm-backend              (push to main only)
#
# The GHCR namespace is owned/configured by the terraform-registry module so
# the entire registry infrastructure is provisioned as code, with no manual
# GitHub UI steps.

on:
  push:
    branches: [main]
    paths:
      - 'ComicRealmBE/**'
      - 'terraform/registry/**'
      - '.github/workflows/build-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ComicRealmBE/**'
      - 'terraform/registry/**'
      - '.github/workflows/build-backend.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment tag (dev|tst|acc|prd)'
        required: true
        default: 'dev'
        type: choice
        options: [dev, tst, acc, prd]

permissions:
  contents: read
  packages: write    # required to push to ghcr.io
  id-token: write    # enables Sigstore/cosign keyless signing if added later

concurrency:
  group: build-backend-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  TF_VERSION: '1.9.5'
  TF_DIR: terraform/registry
  IMAGE_NAME: comicrealm-backend
  TF_ENV: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  terraform-plan:
    name: terraform plan (registry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false -reconfigure -backend-config=envs/registry.backend.hcl

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate -no-color

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        env:
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
        run: |
          terraform plan -input=false -no-color \
            -var "github_repository=${GITHUB_REPOSITORY#*/}"

  build-and-push:
    name: build & push backend image
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && env.TF_ENV || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image reference (lowercased)
        id: img
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ref=ghcr.io/${owner_lc}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ./ComicRealmBE
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.img.outputs.ref }}:${{ github.sha }}
            ${{ steps.img.outputs.ref }}:${{ env.TF_ENV }}-latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
