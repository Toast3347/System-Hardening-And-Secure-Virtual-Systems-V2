name: build-frontend

# Same shape as build-backend.yml — see that file for the rationale.
#   1. terraform fmt / validate / init / plan on terraform/registry  (every PR + push)
#   2. docker buildx build of ComicRealmFE                           (every PR + push)
#   3. push image to ghcr.io/<owner>/comicrealm-frontend             (push to main only)

on:
  push:
    branches: [main]
    paths:
      - 'ComicRealmFE/**'
      - 'terraform/registry/**'
      - '.github/workflows/build-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ComicRealmFE/**'
      - 'terraform/registry/**'
      - '.github/workflows/build-frontend.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment tag (dev|tst|acc|prd)'
        required: true
        default: 'dev'
        type: choice
        options: [dev, tst, acc, prd]

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write  # upload Trivy SARIF to Code Scanning

concurrency:
  group: build-frontend-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  TF_VERSION: '1.9.5'
  TF_DIR: terraform/registry
  IMAGE_NAME: comicrealm-frontend
  TF_ENV: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  terraform-plan:
    name: terraform plan (registry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false -reconfigure -backend-config=envs/registry.backend.hcl

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate -no-color

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        env:
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
        run: |
          terraform plan -input=false -no-color \
            -var "github_repository=${GITHUB_REPOSITORY#*/}"

  build-and-push:
    name: build & push frontend image
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && (github.event.inputs.environment || 'dev') || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image reference (lowercased)
        id: img
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ref=ghcr.io/${owner_lc}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the image into the local docker daemon first so Trivy can scan
      # it BEFORE anything is pushed. If the scan fails, the workflow stops
      # and the push step never runs.
      - name: Build image (load into local daemon)
        uses: docker/build-push-action@v6
        with:
          context: ./ComicRealmFE
          load: true
          push: false
          tags: |
            ${{ steps.img.outputs.ref }}:${{ github.sha }}
            ${{ steps.img.outputs.ref }}:${{ env.TF_ENV }}-latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Trivy image scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: CRITICAL
          exit-code: '1'              # stop immediately on CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-frontend.sarif

      - name: Upload Trivy image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-image-frontend

      - name: Push image (only when scan passed)
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ steps.img.outputs.ref }}:${{ github.sha }}
          docker push ${{ steps.img.outputs.ref }}:${{ env.TF_ENV }}-latest
