services:
  postgres:
    image: postgres:17-alpine
    container_name: comicrealmdb
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Vault (dev mode) — local secret keeper. NEVER use dev mode in production.
  # All app secrets are written here by `vault-seed` and pulled at runtime by
  # the .NET backend (no secret is ever baked into images or compose files).
  # ---------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.17
    container_name: comicrealm-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://0.0.0.0:8200
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  vault-seed:
    image: hashicorp/vault:1.17
    container_name: comicrealm-vault-seed
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID}
      COMICREAL_DEFAULT_CONNECTION: ${COMICREAL_DEFAULT_CONNECTION}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        vault kv put secret/comicrealm \
          ConnectionStrings__DefaultConnection="$$COMICREAL_DEFAULT_CONNECTION" \
          Jwt__SigningKey="$$JWT_SIGNING_KEY" \
          Jwt__Issuer="$$JWT_ISSUER" \
          Jwt__Audience="$$JWT_AUDIENCE"
    restart: "no"

  comicrealm-migrate:
    build:
      context: ./ComicRealmBE
      dockerfile: Dockerfile
    container_name: comicrealm-migrate
    depends_on:
      postgres:
        condition: service_healthy
      vault-seed:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID}
    command: ["dotnet", "ComicRealmBE.dll", "--migrate-only"]

  comicrealm-seed:
    image: postgres:17-alpine
    container_name: comicrealm-seed
    depends_on:
      comicrealm-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./scripts:/seed-scripts:ro
      - ./comic_digital.csv:/seed/comic_digital.csv:ro
    command: ["psql", "-h", "postgres", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}", "-f", "/seed-scripts/seed-db.sql"]
    restart: "no"

  comicrealmbe:
    build:
      context: ./ComicRealmBE
      dockerfile: Dockerfile
    container_name: comicrealmbe
    depends_on:
      comicrealm-migrate:
        condition: service_completed_successfully
      comicrealm-seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      vault-seed:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID}
    ports:
      - "5053:8080"

  comicrealmfe:
    build:
      context: ./ComicRealmFE
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5053/api}
    container_name: comicrealmfe
    depends_on:
      comicrealmbe:
        condition: service_started
    ports:
      - "5173:8080"

volumes:
  pgdata:
