# =============================================================================
# Hardened nginx server config for the ComicRealmFE SPA.
#   - server_tokens off  → strips the version from the `Server:` header and
#     from default error pages (fixes ZAP "Server Leaks Version Information"
#     and "In Page Banner Information Leak").
#   - Security headers   → CSP, X-Frame-Options, X-Content-Type-Options,
#     Referrer-Policy, Permissions-Policy.
#   - Inline robots.txt / sitemap.xml so ZAP never hits a default 404 page
#     that would still echo the nginx banner.
# =============================================================================

server_tokens off;

map $sent_http_content_type $csp_header {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' http://localhost:5053 http://localhost:8080; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests";
}

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---- security response headers (applied to every response) --------------
    add_header Content-Security-Policy   $csp_header                          always;
    add_header X-Frame-Options           "DENY"                               always;
    add_header X-Content-Type-Options    "nosniff"                            always;
    add_header Referrer-Policy           "no-referrer"                        always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"                       always;

    # ---- crawler files: serve inline so 404s don't leak the nginx banner ----
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /sitemap.xml {
        default_type application/xml;
        return 200 "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\"></urlset>\n";
    }

    # ---- SPA history-mode fallback ------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't expose nginx default error pages with the banner.
    error_page 404 = /index.html;
}
